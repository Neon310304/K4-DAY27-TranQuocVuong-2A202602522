name: Day27 checks
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --group dev
      - run: uv run ruff check exercises app.py scripts tests
      - run: uv run ruff format --check exercises app.py scripts tests
      - run: uv run pytest -q
